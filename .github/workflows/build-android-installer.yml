name: build-android-installer

# Builds DisplayXR-Installer-<ver>.apk — the single tappable Android installer
# (issue #62). It is the Android analogue of DisplayXRBundle-*.exe: one artifact
# the owner of a tablet taps, which then installs the pinned stack and performs
# the post-install steps that installing APKs does not do.
#
# What this workflow gates: that the module COMPILES and that its JVM tests pass.
# Those tests cover asset resolution against real release asset lists and the
# version comparison the browser gate rests on. Nothing here installs anything,
# so it establishes nothing about the app's behaviour on a tablet — see
# android-bundle/README.md "What these scripts cannot prove", which applies
# word for word.
#
# It does NOT download release assets (the app does that at run time, on the
# tablet), so unlike build-android-bundle.yml it is cheap and safe to run on
# every PR that touches the module.

on:
  pull_request:
    paths:
      - 'android-installer/**'
      - '.github/workflows/build-android-installer.yml'
  push:
    branches: [main]
    paths:
      - 'android-installer/**'
      - '.github/workflows/build-android-installer.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release (e.g. android-bundle-2026-09-22). Empty = CI artifact only."
        type: string
        default: ""

permissions:
  contents: write   # only exercised by the final, opt-in attach step

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-installer

    steps:
      - uses: actions/checkout@v5

      # The wrapper jar is a binary committed to a public repo. Validating it
      # against Gradle's published checksums is the cheap answer to "how do you
      # know that jar is the one Gradle shipped".
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Read the version out of gradle.properties
        id: ver
        run: |
          set -euo pipefail
          # ONE source of truth: the same property drives versionName inside the
          # APK and the file name outside it, so the two can never disagree.
          V=$(grep -E '^installerVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [ -n "$V" ] || { echo "::error::installerVersionName missing from gradle.properties"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Debug, not release, and deliberately: an unsigned release APK cannot be
      # installed at all, and this repo signs nothing (see CLAUDE.md). The cost
      # is stated in the README: each run signs with that runner's throwaway
      # debug key, so upgrading the installer itself in place fails with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE — uninstall the old one first. It
      # does not affect anything the installer installs, only the installer.
      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name the artifact
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT="DisplayXR-Installer-${{ steps.ver.outputs.version }}.apk"
          mkdir -p _out
          cp "$SRC" "_out/$OUT"
          ( cd _out && sha256sum "$OUT" > "$OUT.sha256" )
          ls -l _out
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DisplayXR-Installer-${{ steps.ver.outputs.version }}
          path: android-installer/_out/*
          if-no-files-found: error

      # Opt-in, and only onto a release that already exists — the bundle release
      # is cut by build-android-bundle.yml, and this attaches to the same tag
      # rather than creating a second one.
      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.release_tag }}" \
            "_out/${{ steps.apk.outputs.name }}" \
            "_out/${{ steps.apk.outputs.name }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
