name: build-android-installer

# Builds DisplayXR-Installer-<ver>.apk — the single tappable Android installer
# (issue #62). It is the Android analogue of DisplayXRBundle-*.exe: one artifact
# the owner of a tablet taps, which then installs the pinned stack and performs
# the post-install steps that installing APKs does not do.
#
# What this workflow gates: that the module COMPILES and that its JVM tests pass.
# Those tests cover asset resolution against real release asset lists and the
# version comparison the browser gate rests on. Nothing here installs anything,
# so it establishes nothing about the app's behaviour on a tablet — see
# android-bundle/README.md "What these scripts cannot prove", which applies
# word for word.
#
# It does NOT download release assets (the app does that at run time, on the
# tablet), so unlike build-android-bundle.yml it is cheap and safe to run on
# every PR that touches the module.
#
# It builds the STANDARD flavor only — the one that carries no vendor bytes and
# is therefore publishable. The with-services (cnsdk) flavor embeds APKs from a
# private vendor repo and is built by build-android-bundle.yml, the one workflow
# holding that repo's token. Here the cnsdk flavor is only exercised against a
# synthetic staging directory, to prove the Gradle wiring puts its assets in the
# cnsdk APK and NOT in the standard one; that fixture APK is never uploaded.
#
# publish-bundle.yml calls this via workflow_call, so every public bundle release
# carries DisplayXR-Installer-<ver>.apk built from the same commit.

on:
  pull_request:
    paths:
      - 'android-installer/**'
      - '.github/workflows/build-android-installer.yml'
  push:
    branches: [main]
    paths:
      - 'android-installer/**'
      - '.github/workflows/build-android-installer.yml'
  workflow_call:
    inputs:
      # Declared so the attach step's condition reads a defined, empty value when
      # called — publish-bundle.yml attaches the APK in its own release job.
      release_tag:
        type: string
        default: ""
    outputs:
      version:
        description: "installerVersionName the APK was built with"
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: "Name of the uploaded artifact holding the standard APK + .sha256"
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release (e.g. android-bundle-2026-09-22). Empty = CI artifact only."
        type: string
        default: ""

permissions:
  contents: write   # only exercised by the final, opt-in attach step

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact: DisplayXR-Installer-${{ steps.ver.outputs.version }}
    defaults:
      run:
        working-directory: android-installer

    steps:
      - uses: actions/checkout@v5

      # The wrapper jar is a binary committed to a public repo. Validating it
      # against Gradle's published checksums is the cheap answer to "how do you
      # know that jar is the one Gradle shipped".
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # packages: '' on purpose. The action's default is to `sdkmanager tools`,
      # and `tools` is obsolete and no longer published — it fails the job with
      # "Failed to find package 'tools'". The runner image already ships an
      # Android SDK with its licences accepted; all this step adds is current
      # cmdline-tools, and AGP fetches the compileSdk platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Read the version out of gradle.properties
        id: ver
        run: |
          set -euo pipefail
          # ONE source of truth: the same property drives versionName inside the
          # APK and the file name outside it, so the two can never disagree.
          V=$(grep -E '^installerVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [ -n "$V" ] || { echo "::error::installerVersionName missing from gradle.properties"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Both flavors: the tests are shared, but each flavor compiles its own
      # BuildConfig and resources, so a flavor that no longer builds would
      # otherwise surface only in the bundle run.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testStandardDebugUnitTest :app:testCnsdkDebugUnitTest

      # Debug, not release, and deliberately: an unsigned release APK cannot be
      # installed at all, and this repo signs nothing (see CLAUDE.md). The cost
      # is stated in the README: each run signs with that runner's throwaway
      # debug key, so upgrading the installer itself in place fails with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE — uninstall the old one first. It
      # does not affect anything the installer installs, only the installer.
      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleStandardDebug

      # The standard APK goes on PUBLIC releases, so prove from its bytes that it
      # carries nothing embedded: no assets/cnsdk/ tree and no nested APK of any
      # name. Checked on the artifact rather than trusted from the build script,
      # because a flavor mix-up in Gradle is silent until someone unzips a release.
      - name: The standard APK carries no vendor bytes
        run: |
          set -euo pipefail
          A=app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if unzip -Z1 "$A" | grep -E '^assets/cnsdk/|\.apk$'; then
            echo "::error::the standard installer APK embeds files it must not — it is published on public releases"
            exit 1
          fi
          echo "OK: $(unzip -Z1 "$A" | wc -l) entries, none embedded."

      # The cnsdk flavor's wiring, exercised WITHOUT vendor bytes: a synthetic
      # staging directory with two placeholder files where the service APKs go.
      # Proves (a) the flavor packages what the staging names, (b) the packaging
      # check refuses a staging with no services. Never uploaded.
      - name: The cnsdk flavor packages its staging (synthetic fixture)
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/cnsdk-fixture"
          # Must fail, and for the right reason — a compile error would also "fail".
          if out=$(./gradlew --no-daemon -q :app:assembleCnsdkDebug 2>&1); then
            echo "::error::assembleCnsdkDebug succeeded with no staging directory — a with-services build could ship with no services"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'cnsdkStagingDir is not set' || {
            printf '%s\n' "$out" | tail -30
            echo "::error::assembleCnsdkDebug failed, but not at the staging check"; exit 1; }
          mkdir -p "$F/cnsdk/apks" "$F/cnsdk/licenses"
          printf 'fixture-ds' > "$F/cnsdk/apks/device-service-release-0.0.0.apk"
          printf 'fixture-headtracking' > "$F/cnsdk/apks/headTracking-service-release-0.0.0.apk"
          for l in LICENSE.txt LICENSE-3RD-PARTY.txt; do echo fixture > "$F/cnsdk/licenses/$l"; done
          z=$(printf '0%.0s' $(seq 64))
          {
            printf 'tag\tv0.0.0\n'
            printf 'apk\tdevice-service-release-0.0.0.apk\tcom.leialoft.display.config\t0.0.0\t1\t%s\t10\n' "$z"
            printf 'apk\theadTracking-service-release-0.0.0.apk\tcom.leia.headtrackingservice\t0.0.0\t1\t%s\t20\n' "$z"
            printf 'license\tLICENSE.txt\nlicense\tLICENSE-3RD-PARTY.txt\n'
          } > "$F/cnsdk/index.tsv"
          ./gradlew --no-daemon :app:assembleCnsdkDebug -PcnsdkStagingDir="$F"
          C=app/build/outputs/apk/cnsdk/debug/app-cnsdk-debug.apk
          n=$(unzip -Z1 "$C" | grep -cE '^assets/cnsdk/(index\.tsv|apks/.+\.apk|licenses/.+)$' || true)
          [ "$n" = 5 ] || { echo "::error::the cnsdk APK holds $n of the 5 staged files"; unzip -Z1 "$C" | grep assets/ || true; exit 1; }
          # The standard APK from the previous step must still be clean after a cnsdk
          # build in the same tree. (An `if`, not a bare `! pipeline`: set -e ignores a
          # negated command, so that form could never fail the step.)
          if unzip -Z1 app/build/outputs/apk/standard/debug/app-standard-debug.apk | grep '^assets/cnsdk/'; then
            echo "::error::building the cnsdk flavor leaked its assets into the standard APK"; exit 1
          fi
          rm -f "$C"
          echo "OK: cnsdk wiring packages the staging; standard stays clean."

      - name: Name the artifact
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/standard/debug/app-standard-debug.apk
          OUT="DisplayXR-Installer-${{ steps.ver.outputs.version }}.apk"
          mkdir -p _out
          cp "$SRC" "_out/$OUT"
          ( cd _out && sha256sum "$OUT" > "$OUT.sha256" )
          ls -l _out
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DisplayXR-Installer-${{ steps.ver.outputs.version }}
          path: android-installer/_out/*
          if-no-files-found: error

      # Opt-in, and only onto a release that already exists — the bundle release
      # is cut by build-android-bundle.yml, and this attaches to the same tag
      # rather than creating a second one.
      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.release_tag }}" \
            "_out/${{ steps.apk.outputs.name }}" \
            "_out/${{ steps.apk.outputs.name }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
