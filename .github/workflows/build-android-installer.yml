name: build-android-installer

# Builds DisplayXR-Installer-<ver>.apk — the single tappable Android installer
# (issue #62). It is the Android analogue of DisplayXRBundle-*.exe: one artifact
# the owner of a tablet taps, which then installs the pinned stack and performs
# the post-install steps that installing APKs does not do.
#
# What this workflow gates: that the module COMPILES and that its JVM tests pass.
# Those tests cover asset resolution against real release asset lists and the
# version comparison the browser gate rests on. Nothing here installs anything,
# so it establishes nothing about the app's behaviour on a tablet — see
# android-bundle/README.md "What these scripts cannot prove", which applies
# word for word.
#
# It does NOT download release assets (the app does that at run time, on the
# tablet), so unlike build-android-bundle.yml it is cheap and safe to run on
# every PR that touches the module.
#
# There is ONE build of the app, and it carries no vendor bytes: on a 3D tablet it
# downloads the pinned display services from updates.displayxr.org at run time
# (publish-cnsdk-services.yml puts them there). The with-services `cnsdk` flavor that
# embedded them is retired. The no-vendor-bytes check below stays, because this APK
# goes on public releases.
#
# publish-bundle.yml calls this via workflow_call, so every public bundle release
# carries DisplayXR-Installer-<ver>.apk built from the same commit.
#
# SIGNING (README "Signing"). Every published installer is signed with ONE release key,
# because Android updates an installed app only from an APK signed by the same key. The
# key lives in the `android-installer-release` environment, whose deployment-branch policy
# admits `main` only — so a PR (fork or not), or a dispatch from any other branch, never
# sees it, and even a workflow edited on a branch cannot read it. Those runs build the
# release variant signed with the DEBUG key: it compiles, tests and installs, and it is
# unpublishable, because scripts/verify-release-signature.sh (run here, and again in
# publish-bundle.yml right before the release is created) refuses any signer but the one
# pinned in android-installer/release-signing-cert.sha256.

on:
  pull_request:
    paths:
      - 'android-installer/**'
      - '.github/workflows/build-android-installer.yml'
      - '.github/workflows/publish-cnsdk-services.yml'
  push:
    branches: [main]
    paths:
      - 'android-installer/**'
      - '.github/workflows/build-android-installer.yml'
  workflow_call:
    inputs:
      # Declared so the attach step's condition reads a defined, empty value when
      # called — publish-bundle.yml attaches the APK in its own release job.
      release_tag:
        type: string
        default: ""
      # publish-bundle.yml passes true: fail HERE, before anything else of the release
      # is built on top, if the APK is not signed with the pinned release key.
      require_release_key:
        type: boolean
        default: false
    outputs:
      version:
        description: "installerVersionName the APK was built with"
        value: ${{ jobs.build.outputs.version }}
      release_signed:
        description: "'true' when the APK's signer is the pinned release key"
        value: ${{ jobs.build.outputs.release_signed }}
      artifact:
        description: "Name of the uploaded artifact holding the installer APK + .sha256"
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release (e.g. android-bundle-2026-09-22). Empty = CI artifact only. Requires the release key, so dispatch from main."
        type: string
        default: ""

permissions:
  contents: write   # only exercised by the final, opt-in attach step

jobs:
  build:
    runs-on: ubuntu-latest
    # The signing key's environment, on main only (its branch policy would refuse any other
    # ref anyway, and a refused environment FAILS the job rather than skipping the key — so
    # the condition keeps PR and branch runs building, debug-signed). For a workflow_call,
    # github.* is the caller's: publish-bundle dispatched from main gets the key.
    environment: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'android-installer-release' || '' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact: DisplayXR-Installer-${{ steps.ver.outputs.version }}
      release_signed: ${{ steps.pin.outputs.release_signed }}
    defaults:
      run:
        working-directory: android-installer

    steps:
      - uses: actions/checkout@v5

      # The wrapper jar is a binary committed to a public repo. Validating it
      # against Gradle's published checksums is the cheap answer to "how do you
      # know that jar is the one Gradle shipped".
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # packages: '' on purpose. The action's default is to `sdkmanager tools`,
      # and `tools` is obsolete and no longer published — it fails the job with
      # "Failed to find package 'tools'". The runner image already ships an
      # Android SDK with its licences accepted; all this step adds is current
      # cmdline-tools, and AGP fetches the compileSdk platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Read the version out of gradle.properties
        id: ver
        run: |
          set -euo pipefail
          # ONE source of truth: the same property drives versionName inside the
          # APK and the file name outside it, so the two can never disagree.
          V=$(grep -E '^installerVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [ -n "$V" ] || { echo "::error::installerVersionName missing from gradle.properties"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Includes DisplayServicesTest, which also checks that the certificate pin compiled
      # into the app equals scripts/service-signers.tsv — the table the publishing
      # workflow enforces — so the two cannot drift apart.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: The services publishing script parses
        run: bash -n scripts/make-services-manifest.sh

      # The keystore goes to a file outside the checkout (RUNNER_TEMP) and is deleted at the
      # end of the job; only its PATH reaches Gradle. Absent secret = no file = the release
      # variant falls back to the debug key (app/build.gradle.kts).
      - name: Decode the release key (main only)
        env:
          KS_B64: ${{ secrets.ANDROID_INSTALLER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "No release key in this run (PR, fork, or not main) — the APK will be DEBUG-signed and unpublishable."
            exit 0
          fi
          ks="$RUNNER_TEMP/dxr-installer-release.p12"
          ( umask 077; printf '%s' "$KS_B64" | base64 -d > "$ks" )
          echo "ANDROID_INSTALLER_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
          echo "Release key decoded ($(wc -c < "$ks") bytes)."

      # The release variant, always: signed with the release key when the step above found
      # one, with the debug key otherwise. One task and one output path for both cases, so
      # what a PR builds is what a release builds, minus the key.
      - name: Assemble
        env:
          ANDROID_INSTALLER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_INSTALLER_KEYSTORE_PASSWORD }}
          ANDROID_INSTALLER_KEY_ALIAS: ${{ secrets.ANDROID_INSTALLER_KEY_ALIAS }}
          ANDROID_INSTALLER_KEY_PASSWORD: ${{ secrets.ANDROID_INSTALLER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # Is it signed with THE key? Judged from the APK's bytes against the committed pin.
      # Required (and so a failure) when a release depends on it or when the key was
      # present — a key that is present but produces the wrong signer is a broken secret,
      # not a PR. Otherwise it is reported and the run stays green.
      - name: Release-key pin check
        id: pin
        env:
          REQUIRE: ${{ inputs.require_release_key == true || inputs.release_tag != '' || env.ANDROID_INSTALLER_KEYSTORE_FILE != '' }}
        run: |
          set -euo pipefail
          A=app/build/outputs/apk/release/app-release.apk
          if scripts/verify-release-signature.sh "$A"; then
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
            if [ "$REQUIRE" = true ]; then
              echo "::error::this APK must be signed with the pinned release key and is not — see above"
              exit 1
            fi
            echo "::warning::DEBUG-signed APK (no release key in this run): fine for testing, refused by every publish path."
          fi

      # Proves the check above can fail: the same bytes re-signed with a key made up on the
      # spot must be REFUSED. Without this, a verifier that always passed would look exactly
      # like a working one on main.
      - name: The pin check refuses a foreign key
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          t="$RUNNER_TEMP/negative"; mkdir -p "$t"
          keytool -genkeypair -keystore "$t/foreign.p12" -storetype PKCS12 -alias x -keyalg EC -groupname secp256r1 \
            -validity 1 -dname "CN=Not DisplayXR" -storepass throwaway -keypass throwaway >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$t/foreign.p12" --ks-pass pass:throwaway --ks-key-alias x \
            --out "$t/foreign.apk" app/build/outputs/apk/release/app-release.apk
          if scripts/verify-release-signature.sh "$t/foreign.apk"; then
            echo "::error::verify-release-signature.sh ACCEPTED an APK signed with a throwaway key — the release gate is broken"
            exit 1
          fi
          echo "OK: a foreign-key APK is refused."

      # The APK goes on PUBLIC releases, so prove from its bytes that it
      # carries nothing embedded: no assets/cnsdk/ tree and no nested APK of any
      # name. Checked on the artifact rather than trusted from the build script,
      # because a flavor mix-up in Gradle is silent until someone unzips a release.
      - name: The APK carries no vendor bytes
        run: |
          set -euo pipefail
          A=app/build/outputs/apk/release/app-release.apk
          if unzip -Z1 "$A" | grep -E '^assets/cnsdk/|\.apk$'; then
            echo "::error::the installer APK embeds files it must not — it is published on public releases"
            exit 1
          fi
          echo "OK: $(unzip -Z1 "$A" | wc -l) entries, none embedded."

      - name: Name the artifact
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/app-release.apk
          # A debug-signed build says so in its file name, so a PR artifact passed around
          # by hand cannot be mistaken for a release (it would not update a tablet's copy).
          SUFFIX=""
          [ "${{ steps.pin.outputs.release_signed }}" = true ] || SUFFIX="-DEBUGKEY"
          OUT="DisplayXR-Installer-${{ steps.ver.outputs.version }}$SUFFIX.apk"
          mkdir -p _out
          cp "$SRC" "_out/$OUT"
          ( cd _out && sha256sum "$OUT" > "$OUT.sha256" )
          ls -l _out
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DisplayXR-Installer-${{ steps.ver.outputs.version }}
          path: android-installer/_out/*
          if-no-files-found: error

      # Opt-in, and only onto a release that already exists — the bundle release
      # is cut by build-android-bundle.yml, and this attaches to the same tag
      # rather than creating a second one. Only a release-signed APK gets here: a
      # release_tag makes the pin check above required.
      - name: Attach to the release
        if: inputs.release_tag != '' && steps.pin.outputs.release_signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.release_tag }}" \
            "_out/${{ steps.apk.outputs.name }}" \
            "_out/${{ steps.apk.outputs.name }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/dxr-installer-release.p12"
