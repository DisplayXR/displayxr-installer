name: Publish bundle

# Manual-only. NOT auto-fired by component releases — bundle ships at
# the cadence of the *whole stack* being launch-ready, not at the
# cadence of any single component. See issue
# DisplayXR/displayxr-runtime#284 §Release flow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Bundle release tag (vX.Y.Z)"
        required: true
      prerelease:
        description: "Mark release as prerelease"
        type: boolean
        default: false

permissions:
  contents: write   # release job needs it; drift-guard only reads

jobs:
  # Belt-and-braces drift guard: versions.json in this repo is mirrored
  # byte-for-byte from displayxr-runtime/versions.json by the runtime's
  # versions-bump.yml. If a human hand-edited this repo's file (or the
  # mirror step ever silently failed), the bundle should refuse to
  # build a stack that doesn't match the dev orchestrator's pin matrix.
  # See displayxr-runtime/docs/specs/runtime/versions-json-autobump.md.
  assert-versions-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare against displayxr-runtime/versions.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Contents API, not raw.githubusercontent.com — the latter
          # is CDN-cached and can lag 1–5 min after a push, which would
          # produce false positives right after a fresh mirror commit. The
          # Contents API is authoritative; mirror-then-publish is safe.
          gh api repos/DisplayXR/displayxr-runtime/contents/versions.json \
              --jq '.content' | base64 -d > /tmp/runtime-versions.json
          if ! diff -u /tmp/runtime-versions.json versions.json; then
            echo "::error::versions.json drift detected. This file is auto-mirrored from displayxr-runtime; do not hand-edit. If a previous mirror commit failed, re-run displayxr-runtime/.github/workflows/versions-bump.yml (or its BumpVersionsJsonOnTag job) — never patch this file by hand."
            exit 1
          fi
          echo "versions.json matches displayxr-runtime/main — proceeding with bundle build."

  build-macos:
    needs: assert-versions-in-sync
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: brew install jq

      - name: Build macOS bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-bundle.sh --version "${{ inputs.tag }}"

      - uses: actions/upload-artifact@v6
        with:
          name: DisplayXRBundle-macOS
          path: _out/DisplayXRBundle-*.pkg
          if-no-files-found: error

  build-windows:
    needs: assert-versions-in-sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # NSIS - prefer the copy already on the runner image.
      #
      # The GitHub `windows-*` images ship NSIS preinstalled at
      # `C:\Program Files (x86)\NSIS\makensis.exe`. A bare
      # `choco install nsis -y` is a single-attempt dependency on the
      # Chocolatey CDN; when that CDN started answering 503 it took
      # displayxr-shell-pvt's Windows build red for days
      # (displayxr-shell-pvt#104). This is that fix, ported.
      #
      # Order: use the preinstalled makensis if present -> else retry
      # `choco install` (pinned, --no-progress, exponential backoff) ->
      # else download the official NSIS setup direct from SourceForge and
      # verify its SHA-256 before running it. Never a bare single attempt.
      # `scripts\build-bundle.bat` invokes `makensis` off PATH, so
      # publishing the directory on GITHUB_PATH is all the build needs.
      - name: Ensure NSIS
        shell: pwsh
        env:
          NSIS_FALLBACK_VERSION: '3.10'
          # sha256 of nsis-3.10-setup.exe as published on SourceForge.
          # NSIS releases are not Authenticode-signed, so the checksum is
          # the only integrity control - verify before executing.
          NSIS_FALLBACK_SHA256: '4313d352e0dafd1f22b6517126a655cae3b444fa758d2845eddfbe72f24f7bdd'
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell 7.4 defaults $PSNativeCommandUseErrorActionPreference
          # to $true, which would turn a failing `choco install` into a
          # terminating error and defeat the retry loop below.
          $PSNativeCommandUseErrorActionPreference = $false

          function Find-MakeNSIS {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $candidates = @(
              "$env:ProgramFiles\NSIS\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              'C:\Program Files\NSIS\makensis.exe',
              'C:\Program Files (x86)\NSIS\makensis.exe',
              "$env:ChocolateyInstall\bin\makensis.exe"
            )
            foreach ($p in $candidates) {
              if ($p -and (Test-Path $p)) { return $p }
            }
            return $null
          }

          $mk = Find-MakeNSIS
          if ($mk) {
            Write-Host "NSIS already present on the runner image: $mk"
          }

          # (b1) Chocolatey, but resilient: pinned version, no progress
          # spam, 3 attempts with exponential backoff.
          if (-not $mk) {
            Write-Host "::warning::NSIS not preinstalled -- falling back to Chocolatey."
            $delay = 15
            foreach ($attempt in 1..3) {
              # Pin the version for reproducibility on the first two tries;
              # if the pinned package itself is what the CDN can't serve,
              # the last attempt takes whatever `nsis` currently resolves to
              # rather than failing the build over a pin.
              if ($attempt -lt 3) {
                $cargs = @('install','nsis','--version',$env:NSIS_FALLBACK_VERSION,'-y','--no-progress')
              } else {
                $cargs = @('install','nsis','-y','--no-progress')
              }
              Write-Host "choco $($cargs -join ' ') (attempt $attempt/3)"
              & choco @cargs
              $mk = Find-MakeNSIS
              if ($mk) { break }
              if ($attempt -lt 3) {
                Write-Host "Chocolatey install failed; retrying in ${delay}s..."
                Start-Sleep -Seconds $delay
                $delay = $delay * 2
              }
            }
          }

          # (b2) Direct download from the upstream release host, checksum-
          # verified. Independent of the Chocolatey CDN entirely.
          if (-not $mk) {
            Write-Host "::warning::Chocolatey install failed -- downloading NSIS $env:NSIS_FALLBACK_VERSION direct."
            $ver = $env:NSIS_FALLBACK_VERSION
            $exe = Join-Path $env:RUNNER_TEMP 'nsis-setup.exe'
            $want = $env:NSIS_FALLBACK_SHA256.ToLower()
            $urls = @(
              "https://downloads.sourceforge.net/project/nsis/NSIS%203/$ver/nsis-$ver-setup.exe",
              "https://sourceforge.net/projects/nsis/files/NSIS%203/$ver/nsis-$ver-setup.exe/download",
              "https://prdownloads.sourceforge.net/nsis/nsis-$ver-setup.exe?download"
            )
            # curl.exe (shipped in-box on every windows-* image) follows the
            # SourceForge mirror redirects properly. Invoke-WebRequest
            # -UseBasicParsing stops at the interstitial HTML page and saves
            # ~147 KB of markup instead of the 1.5 MB installer -- verified
            # locally -- so curl is the primary and IWR only the last resort.
            # The checksum is what decides success, so an interstitial page
            # simply rolls over to the next mirror instead of being executed.
            $ok = $false
            $delay = 15
            foreach ($url in $urls) {
              foreach ($attempt in 1..3) {
                Remove-Item $exe -ErrorAction SilentlyContinue
                Write-Host "GET $url (attempt $attempt/3)"
                & curl.exe -sSL --fail --retry 2 --max-time 300 -o $exe $url
                if (-not (Test-Path $exe)) {
                  try {
                    Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing -MaximumRedirection 10
                  } catch {
                    Write-Host "  download failed: $($_.Exception.Message)"
                  }
                }
                if (Test-Path $exe) {
                  $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
                  if ($got -eq $want) {
                    Write-Host "  checksum OK ($got)"
                    $ok = $true
                    break
                  }
                  Write-Host "  checksum mismatch (got $got) -- not the installer; discarding."
                  Remove-Item $exe -ErrorAction SilentlyContinue
                }
                if ($attempt -lt 3) { Start-Sleep -Seconds $delay; $delay = $delay * 2 }
              }
              if ($ok) { break }
            }
            if (-not $ok) {
              Write-Error "Could not obtain a checksum-verified nsis-$ver-setup.exe (sha256 $want) from any mirror."
            }

            # NSIS ships a silent-install switch (/S) and honours /D=<dir>
            # (must be the last argument, unquoted).
            $dest = 'C:\NSIS'
            $proc = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              Write-Error "NSIS silent install failed (exit $($proc.ExitCode))."
            }
            if (Test-Path "$dest\makensis.exe") { $mk = "$dest\makensis.exe" } else { $mk = Find-MakeNSIS }
          }

          if (-not $mk) {
            Write-Error "NSIS unavailable after every strategy (preinstalled / choco / direct download)."
          }

          # Publish on PATH for the build script's `makensis` lookup.
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $mk) -Encoding utf8
          Write-Host "makensis: $mk"
          & $mk /VERSION
          Write-Host ""

      - name: Build Windows bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: scripts\build-bundle.bat --version "${{ inputs.tag }}"

      - uses: actions/upload-artifact@v6
        with:
          name: DisplayXRBundle-Windows
          path: _out\DisplayXRBundle-*.exe
          if-no-files-found: error

  # Linux bundle (#781 Phase 3): packs the pinned per-component .deb release
  # assets into DisplayXRBundle-<ver>-linux-amd64.tar.gz. build-bundle-linux.sh
  # hard-requires the runtime + leia-sr core .debs and gracefully skips any
  # demo whose Linux .deb isn't a released asset yet (logs "no-asset"). No sign
  # step — .deb integrity is apt/dpkg's job, not Authenticode's.
  build-linux:
    needs: assert-versions-in-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build Linux bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-bundle-linux.sh --version "${{ inputs.tag }}"

      - uses: actions/upload-artifact@v6
        with:
          name: DisplayXRBundle-Linux
          path: _out/DisplayXRBundle-*-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: _out
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh _out/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: DisplayXR ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            _out/DisplayXRBundle-*.pkg
            _out/DisplayXRBundle-*.exe
            _out/DisplayXRBundle-*-linux-amd64.tar.gz
          fail_on_unmatched_files: true

      # ---------------------------------------------------------------------
      # THIS WORKFLOW CANNOT SIGN. The EV cert lives on the signing provider's
      # self-hosted runner ($DXR_SIGN_REPO), so the bundle .exe is signed
      # post-hoc by the /installer-release skill (Phase 4.5), which re-uploads
      # the signed asset over the one published above.
      #
      # A raw `gh workflow run publish-bundle` therefore ships an UNSIGNED
      # bundle, and the run still goes green — exactly how v2.0.3 reached
      # users with a SmartScreen warning. This step makes that outcome loud
      # instead of silent. It is deliberately ADVISORY: signing never gates
      # publishing (an unsigned fallback release is still a valid outcome),
      # so it always exits 0 and never turns the run red.
      # ---------------------------------------------------------------------
      - name: Warn if the published bundle is unsigned
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          exe=$(ls _out/DisplayXRBundle-*.exe | head -n1)
          out=$(osslsigncode verify -in "$exe" 2>&1 || true)
          # Chain-trust failures are expected here (no MS root on the runner);
          # we only care whether a signature is present at all.
          if printf '%s' "$out" | grep -qi 'No signature found'; then
            echo "::warning title=Bundle published UNSIGNED::$(basename "$exe") has no Authenticode signature. Users will see a SmartScreen warning. Run /installer-release ${{ inputs.tag }} to sign and re-upload."
            {
              echo "### ⚠️ Bundle published UNSIGNED"
              echo
              echo "\`$(basename "$exe")\` carries no Authenticode signature — users will hit SmartScreen."
              echo
              echo "This workflow cannot sign (the cert is on the signing provider's runner)."
              echo "To fix, run: \`/installer-release ${{ inputs.tag }}\` — it signs the .exe and re-uploads it over this asset."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            signer=$(printf '%s' "$out" | grep -i 'Signer.*:' | head -n1 || true)
            echo "Bundle is signed. $signer"
            {
              echo "### ✅ Bundle is signed"
              echo
              echo "\`$(basename "$exe")\` carries an Authenticode signature."
              [ -n "$signer" ] && echo "\`$signer\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # NOTE: the OneDrive upload used to live HERE, but this job runs BEFORE the
      # post-hoc signing (Phase 4.5 of /installer-release), so it always mirrored
      # the UNSIGNED bundle. It now lives in its own `upload-bundle-onedrive.yml`
      # (workflow_dispatch), which the /installer-release skill fires AFTER it has
      # signed the .exe and re-uploaded it over the release asset — so OneDrive
      # always gets the signed bundle. Do NOT re-add an upload step here.
