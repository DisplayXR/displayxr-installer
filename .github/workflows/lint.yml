name: lint

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vendor-name guard
        run: |
          # Enforces the DisplayXR vendor-neutrality contract: authored files must
          # not self-brand with the display vendor's company name. The literal is
          # constructed at runtime so this workflow does not itself contain it.
          #
          # Excluded paths:
          #   .git, .claude       - not authored product content
          #   openxr/             - OpenXR extension headers vendored VERBATIM from
          #                         displayxr-runtime; they carry upstream's copyright
          #                         line and must match byte-for-byte.
          #   displayxr-common    - policed in its own repo (submodule / FetchContent).
          #   CHANGELOG.md        - historical record; may name the original vendor SDK.
          #   CLAUDE.md           - documents the DisplayXR org, which legitimately
          #                         names the vendor plug-in repo by its published name.
          #
          # Tier-A allowlist (ALLOW): legitimate names of the vendor hardware /
          # plug-in / SDK / OEM the ecosystem integrates with - like naming NVIDIA in
          # CUDA code. A line containing any of these tokens is permitted.
          FORBIDDEN="le""ia"
          ALLOW='cnsdk|leia_cnsdk|libdxrp050_leia_cnsdk|leiasdk|leiasr|displayxr-leia|leia-plugin|leiaplugin|leia_plugin|leia_tag|leia-sr|leia sr|leia hardware|leia display|leia dp|leia android dp|leia sdk|leia plug|leia panel|leia weave|leia face|leia viewer|leia-viewer|leia convention|leia lif|leia heif|leia image format|leiaschema|classic leia|leialoft|leiainc/|leia/sr|LEIA_EXE|LEIA_VER|LEIA_TAG|SecLeia|G_Leia|LeiaUnrealSDK|LeiaPlayerWin|libleiacore|leia_interlacer'
          hits=$(grep -rniI \
                   --exclude-dir=.git --exclude-dir=.claude \
                   --exclude-dir=openxr --exclude-dir=displayxr-common \
                   --exclude=CHANGELOG.md --exclude=CLAUDE.md \
                   "$FORBIDDEN" . | grep -viE "$ALLOW" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Vendor company name found in authored files (not covered by the Tier-A allowlist). Neutralize it, or add a legitimate hardware/plug-in token to ALLOW."
            exit 1
          fi
          echo "OK: no non-allowlisted vendor-name references in authored files."

      - name: Android harness helpers are defined once
        run: |
          # restore_rotation lived in seven copies and had already drifted into three
          # variants -- two of them silently skipping the verification that the pad's
          # rotation was actually handed back. lib.sh is now the single definition; this
          # keeps it that way, and catches the other half of the mistake too (a script
          # that calls a helper but forgot to source lib.sh, which fails only at runtime
          # on the pad, i.e. exactly when it costs the most).
          cd android-bundle/scripts
          fns=$(grep -oE '^[a-z_]+\(\)' lib.sh | tr -d '()')
          [ -n "$fns" ] || { echo "::error::lib.sh defines no functions -- did it move?"; exit 1; }
          fail=0
          for fn in $fns; do
            dup=$(grep -l "^$fn() " *.sh | grep -v '^lib\.sh$' || true)
            if [ -n "$dup" ]; then
              echo "::error::$fn is defined in lib.sh and redefined in: $(echo $dup | tr '\n' ' ')"
              fail=1
            fi
          done
          for f in *.sh; do
            [ "$f" = lib.sh ] && continue
            used=""
            # Ignore FULL-LINE comments -- "<ver>" in prose tripped this. Deliberately not
            # stripping trailing comments: a '#' inside a string (grep 'Recent #[0-9]+')
            # would truncate real code and turn this into a false negative, which is the
            # expensive direction. Keep the match loose otherwise, so `trap restore_rotation
            # EXIT` still counts as a use.
            body=$(sed 's/^[[:space:]]*#.*$//' "$f")
            for fn in $fns; do printf '%s\n' "$body" | grep -qE "(^|[^A-Za-z_])$fn([^A-Za-z_]|$)" && used="$used $fn"; done
            [ -n "$used" ] || continue
            grep -q 'lib\.sh' "$f" || { echo "::error::$f calls$used but never sources lib.sh"; fail=1; }
          done
          for f in *.sh; do bash -n "$f" || { echo "::error::$f does not parse"; fail=1; }; done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: $(echo $fns | wc -w | tr -d ' ') helpers defined once in lib.sh; every caller sources it; all scripts parse."

      - name: Workflow YAML is valid
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"
