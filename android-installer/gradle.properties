# The installer APK's own version. CI reads this to name the artifact
# DisplayXR-Installer-<installerVersionName>.apk, so the file name and the
# versionName inside the APK can never disagree.
installerVersionName=0.1.0
installerVersionCode=1

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
