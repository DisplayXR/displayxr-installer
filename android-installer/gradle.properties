# The installer APK's own version. CI reads this to name the artifact
# DisplayXR-Installer-<installerVersionName>.apk, so the file name and the
# versionName inside the APK can never disagree.
#
# Bump it whenever the app's behaviour changes. "Which build was on the tablet"
# has to be answerable from the file name alone — the first device run and the
# fixes for what it found are two different apps, and they must not share a name.
# 0.2.0: the on-device findings from the K68 run (browser version identity, the
# confirmation watchdog, the keyguard wait).
# 0.3.0: the two flavors — standard (public releases) and cnsdk (carries the vendor
# display services, installs them first, asks for the reboot). Both flavors share
# this one version.
# 0.3.1: the NP02J end-to-end run from factory services — back on top after Android's
# "App installed" screen, resumable downloads + per-row retry, the browser opt-in and
# the reboot reminder surviving a relaunch.
# 0.4.0: ONE public APK for every tablet. On a 3D tablet (device-service shipped as a system
# app) it downloads the pinned display services from updates.displayxr.org, verifies size,
# sha256 and the vendor signing certificate, and installs them first; if it cannot, it says
# 3D will not work instead of finishing as a success. The with-services (cnsdk) flavor is
# retired.
installerVersionName=0.4.0
installerVersionCode=5

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
